<span class="meta">Luna · 第 1 轮</span></div>
<div class="exchange"><div class="row"><div class="label">提问</div><p>请直接编写 MATLAB 函数 motion_psf_ai(len,theta)，根据运动长度（像素）和直角坐标系逆时针角度（度），构造匀速直线运动的离散点扩散函数，目标是与 MATLAB fspecial(&#x27;motion&#x27;,LEN,THETA) 输出一致。</p></div>
<div class="row"><div class="label">答复</div><p>代码把运动轨迹视为长度为 <code>len</code> 的连续线段，逐像素计算线段穿过该像素方格的长度，再将结果归一化。角度按直角坐标系逆时针解释，并在写入矩阵时映射到向下递增的图像行坐标。</p></div></div>
